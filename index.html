<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>MoltenDisplay</title>
    <style>
      :root {
        --bg: #f2f3f7;
        --s1: #fff;
        --s2: #e8eaf1;
        --bd: #cfd4e0;
        --fg: #14171f;
        --mut: #566074;
        --ac: #c4520a;
        --acfg: #fff;
        --dn: #d02723;
        --r: 16px;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-theme="hc"]) {
          --bg: #0b0d12;
          --s1: #2346a0;
          --s2: #1d2331;
          --bd: #2b3347;
          --fg: #eef1f7;
          --mut: #94a1b9;
          --ac: #ff8a1f;
          --acfg: #1a0e00;
          --dn: #e5322d;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0d12;
        --s1: #141822;
        --s2: #1d2331;
        --bd: #2b3347;
        --fg: #eef1f7;
        --mut: #94a1b9;
        --ac: #ff8a1f;
        --acfg: #1a0e00;
        --dn: #e5322d;
      }
      :root[data-theme="hc"] {
        --bg: #000;
        --s1: #000;
        --s2: #111;
        --bd: #fff;
        --fg: #fff;
        --mut: #e0e0e0;
        --ac: #ffe600;
        --acfg: #000;
        --dn: #ff3b30;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Color Emoji",
          "Apple Color Emoji",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        min-height: 100%;
      }
      [hidden] {
        display: none !important;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--bg);
        z-index: 10;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 14px 14px 100px;
      }
      .scr {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        margin: 6px 0 0;
        font-size: 2rem;
        letter-spacing: -0.5px;
        background: linear-gradient(90deg, var(--ac), #ff5e62);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h2 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: -0.3px;
      }
      h3 {
        margin: 4px 0 0;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--mut);
      }
      p {
        margin: 0;
      }
      .sub {
        color: var(--mut);
      }
      .small {
        font-size: 0.85rem;
        color: var(--mut);
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      .btn,
      .chip,
      .tile {
        border: 1px solid var(--bd);
        background: var(--s1);
        border-radius: var(--r);
        min-height: 48px;
        padding: 10px 16px;
        font-weight: 600;
        transition:
          transform 0.12s,
          border-color 0.12s;
      }
      .btn:active,
      .chip:active,
      .tile:active {
        transform: scale(0.97);
      }
      .btn:hover,
      .chip:hover,
      .tile:hover {
        border-color: var(--ac);
      }
      .btn.pri {
        background: linear-gradient(135deg, var(--ac), #ff5e62);
        color: var(--acfg);
        border: 0;
        min-height: 56px;
        font-size: 1.05rem;
        box-shadow: 0 8px 24px -10px var(--ac);
      }
      .btn.dn {
        background: var(--dn);
        color: #fff;
        border-color: var(--dn);
      }
      .chip {
        min-height: 42px;
        padding: 6px 14px;
        font-weight: 500;
        border-radius: 999px;
        font-size: 0.92rem;
      }
      .chip[aria-pressed="true"] {
        background: var(--ac);
        color: var(--acfg);
        border-color: var(--ac);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--ac);
        outline-offset: 2px;
      }
      .hero {
        min-height: 120px;
        width: 100%;
        border: 0;
        border-radius: 22px;
        color: #fff;
        font-size: 1.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #e5322d, #a30f2d);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        box-shadow: 0 14px 34px -14px #e5322d;
      }
      .hero b {
        font-size: 2.4rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        min-height: 112px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 2px;
        padding: 14px;
        text-align: left;
        border-radius: 20px;
      }
      .tile b {
        font-size: 1.8rem;
      }
      .tile span {
        font-weight: 400;
        font-size: 0.8rem;
        color: var(--mut);
      }
      .card {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .scrollx {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
      }
      .scrollx .chip {
        flex: none;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.88rem;
        color: var(--mut);
      }
      label.ck {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        color: var(--fg);
        font-size: 1rem;
      }
      input[type="checkbox"] {
        width: 24px;
        height: 24px;
        accent-color: var(--ac);
      }
      input[type="range"] {
        width: 100%;
        height: 32px;
        accent-color: var(--ac);
      }
      input[type="color"] {
        width: 100%;
        height: 46px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--s2);
        padding: 3px;
      }
      input[type="text"],
      textarea,
      select {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--s2);
        color: var(--fg);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .prev {
        aspect-ratio: 16/9;
        width: 100%;
        border: 1px solid var(--bd);
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        background: #000;
      }
      .prev.guides::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(#fff9, #fff9) center/1px 100% no-repeat,
          linear-gradient(#fff9, #fff9) center/100% 1px no-repeat;
      }
      .tw {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .st {
        width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.1;
        padding: 2%;
        font-weight: 800;
      }
      .sc {
        flex: none;
        white-space: nowrap;
        font-weight: 800;
        line-height: 1.1;
      }
      @keyframes scr {
        from {
          transform: translateX(var(--w));
        }
        to {
          transform: translateX(calc(var(--tw) * -1));
        }
      }
      .emo {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
        gap: 6px;
      }
      .emo button {
        font-size: 1.7rem;
        min-height: 52px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--s2);
      }
      #emoin {
        font-size: 1.5rem;
      }
      .sos {
        font-size: 1.3rem;
        letter-spacing: 4px;
        text-align: center;
        color: var(--fg);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      li.m {
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 12px;
        background: var(--s1);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mt {
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      nav.tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
        background: color-mix(in srgb, var(--s1) 88%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--bd);
      }
      nav.tabs div {
        display: flex;
        gap: 2px;
        width: 100%;
        max-width: 720px;
      }
      nav.tabs button {
        flex: 1;
        border: 0;
        background: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 6px 0;
        border-radius: 12px;
        font-size: 0.68rem;
        color: var(--mut);
        min-height: 52px;
      }
      nav.tabs button b {
        font-size: 1.3rem;
        font-weight: 400;
      }
      nav.tabs button[aria-current="page"] {
        color: var(--ac);
        background: var(--s2);
      }
      #stage {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #000;
        touch-action: manipulation;
      }
      #content,
      #dim {
        position: absolute;
        inset: 0;
      }
      #content {
        overflow: hidden;
      }
      #dim {
        background: #000;
        pointer-events: none;
      }
      .ctl {
        position: absolute;
        left: 8px;
        right: 8px;
        top: calc(8px + env(safe-area-inset-top, 0px));
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        z-index: 2;
      }
      .ctl button {
        min-height: 56px;
        min-width: 56px;
        padding: 8px 14px;
        border-radius: 14px;
        border: 3px solid #fff;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-weight: 700;
      }
      #cd {
        align-self: center;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        border-radius: 10px;
        padding: 6px 10px;
        font-weight: 700;
      }
      #hint {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        z-index: 2;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 0.9rem;
        text-align: center;
      }
      .hold {
        outline: 5px solid #ffe600;
      }
      #modal {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      #modal .card {
        max-width: 560px;
        max-height: 90vh;
        overflow: auto;
      }
      #modal li {
        list-style: disc;
        margin-left: 18px;
        display: list-item;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(90px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 90;
        background: var(--s2);
        color: var(--fg);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 10px 14px;
        max-width: 92vw;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
      @media (orientation: landscape) and (max-height: 480px) {
        .tile {
          min-height: 80px;
        }
        .hero {
          min-height: 80px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <nav class="tabs" id="tabs" aria-label="Main"><div></div></nav>
    <div id="stage" hidden>
      <div id="content"></div>
      <div id="dim"></div>
      <div class="ctl">
        <button id="stopBtn" aria-label="Stop display">■ Stop</button
        ><span id="cd"></span
        ><button id="lockBtn" aria-label="Lock touch">🔒 Lock</button>
      </div>
      <div id="hint" hidden>
        Touch lock is on. Hold 🔓 for 1.5 s to unlock, or hold ■ for 1 s to
        stop. Android Back also stops.
      </div>
    </div>
    <div
      id="modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="mt"
    ></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <noscript>MoltenDisplay needs JavaScript enabled.</noscript>

          }),
      );
      $("#tclr").onclick = () => set("text", "");
      $("#trst").onclick = () => {
        [
          "tsize",
          "tfg",
          "tbg",
          "talign",
          "tscroll",
          "tspeed",
          "tmirror",
          "tfit",
        ].forEach((k) => (S[k] = DEF[k]));
        save();
        sync();
        refresh();
      };
      COMBOS.forEach(([f, b, n]) => {
        const c = h(
          "button",
          {
            class: "chip",
            "aria-label": n,
            onclick: () => {
              S.tfg = f;
              S.tbg = b;
              save();
              sync();
              refresh();
            },
          },
          n,
        );
        c.style.cssText = `color:${f};background:${b}`;
        $("#combos").append(c);
      });
      $("#tgo").onclick = () => showText(S.text);

      /* ---------- Emoji board ---------- */
      let ecat = Object.keys(ECAT)[0];
      function drawEmo() {
        const g = $("#egrid");
        g.replaceChildren();
        ECAT[ecat].split(" ").forEach((e) =>
          g.append(
            h(
              "button",
              {
                "aria-label": "Add " + e,
                onclick: () => set("emo", (S.emo + e).slice(0, 120)),
              },
              e,
            ),
          ),
        );
        $$("#ecats button").forEach((b) =>
          b.setAttribute("aria-pressed", b.textContent === ecat),
        );
      }
      Object.keys(ECAT).forEach((c) =>
        $("#ecats").append(
          h(
            "button",
            {
              class: "chip",
              onclick: () => {
                ecat = c;
                drawEmo();
              },
            },
            c,
          ),
        ),
      );
      ESEQ.forEach((s) =>
        $("#eseq").append(
          h("button", { class: "chip", onclick: () => set("emo", s) }, s),
        ),
      );
      $("#ebk").onclick = () => {
        const a = seg(S.emo);
        a.pop();
        set("emo", a.join(""));
      };
      $("#eclr").onclick = () => set("emo", "");
      $("#ego").onclick = () =>
        D.start({
          name: "Emoji Board",
          dur: S.dur,
          render: (b) => renderText(b, eOpts()),
        });
      drawEmo();

      /* ---------- Emergency ---------- */
      $("#emain").onclick = () => showEm(S.emsg);
      EMG.forEach((m) =>
        $("#emgrid").append(
          h(
            "button",
            {
              class: "btn" + (m === "HELP!" ? " dn" : ""),
              onclick: () => showEm(m),
            },
            m,
          ),
        ),
      );
      const sosSpec = (flash) => ({
        name: "SOS",
        dur: S.edur,
        render: (b) => {
          renderText(b, {
            text: "SOS",
            fg: "#ffffff",
            bg: "#000000",
            size: 90,
            align: "center",
            fit: true,
            steady: true,
          });
          flash && SOS.paint();
        },
        run: flash ? () => SOS.run() : null,
        halt: () => SOS.halt(),
      });
      $("#sosf").onclick = () => {
        if (S.steady) {
          toast(
            "Steady-only is on, so SOS stays steady. Change this in Settings.",
          );
          D.start(sosSpec(false));
          return;
        }
        gate(() => D.start(sosSpec(true)));
      };
      $("#soss").onclick = () => D.start(sosSpec(false));

      /* ---------- Saved messages ---------- */
      let ei = -1,
        lf = "all";
      const bt = (t, f, l) =>
        h("button", { class: "chip", "aria-label": l || t, onclick: f }, t);
      function renderLib() {
        const lc = $("#lcats");
        lc.replaceChildren();
        ["all", "fav", ...CATS].forEach((k) => {
          const b = h(
            "button",
            {
              class: "chip",
              onclick: () => {
                lf = k;
                renderLib();
              },
            },
            k === "all" ? "All" : k === "fav" ? "★ Favorites" : k,
          );
          b.setAttribute("aria-pressed", lf === k);
          lc.append(b);
        });
        const ul = $("#ll");
        ul.replaceChildren();
        const rows = L.map((m, i) => ({ m, i }))
          .filter((x) => lf === "all" || (lf === "fav" ? x.m.f : x.m.c === lf))
          .sort((a, b) => (b.m.f ? 1 : 0) - (a.m.f ? 1 : 0));
        if (!rows.length)
          ul.append(
            h(
              "li",
              { class: "small" },
              "Nothing here yet. Write a message above and save it.",
            ),
          );
        rows.forEach(({ m, i }) =>
          ul.append(
            h(
              "li",
              { class: "m" },
              h("div", { class: "mt" }, m.t),
              h("small", { class: "small" }, m.c),
              h(
                "div",
                { class: "row" },
                bt("Show", () => showText(m.t), "Show " + m.t),
                bt("To Text Board", () => {
                  S.text = m.t;
                  save();
                  go("text");
                }),
                bt(
                  m.f ? "★" : "☆",
                  () => {
                    m.f = m.f ? 0 : 1;
                    saveL();
                    renderLib();
                  },
                  m.f ? "Remove favorite" : "Mark favorite",
                ),
                bt("Edit", () => {
                  ei = i;
                  $("#lt").value = m.t;
                  $("#lc").value = m.c;
                  $("#lsave").textContent = "Update message";
                  $("#lcan").hidden = false;
                  $("#lt").focus();
                }),
                bt(
                  "Delete",
                  () => {
                    L.splice(i, 1);
                    saveL();
                    if (ei === i) endEdit();
                    renderLib();
                  },
                  "Delete " + m.t,
                ),
              ),
            ),
          ),
        );
      }
      function endEdit() {
        ei = -1;
        $("#lt").value = "";
        $("#lsave").textContent = "Save message";
        $("#lcan").hidden = true;
      }
      $("#lcan").onclick = endEdit;
      $("#lemo").onclick = () => {
        $("#lt").value = ($("#lt").value + " " + S.emo).trim().slice(0, 500);
      };
      $("#lsave").onclick = () => {
        const t = $("#lt").value.trim();
        if (!t) {
          toast("Type a message first.");
          return;
        }
        if (ei >= 0) {
          L[ei].t = t;
          L[ei].c = $("#lc").value;
        } else L.unshift({ t, c: $("#lc").value, f: 0 });
        saveL();
        endEdit();
        renderLib();
        toast(
          Store.ok
            ? "Message saved."
            : "Saved for this session only (browser storage unavailable).",
        );
      };

      /* ---------- Settings ---------- */
      $("#srst").onclick = () => {
        if (!confirm("Reset all settings and saved messages?")) return;
        S = { ...DEF };
        L = DLIB.map((m) => ({ ...m }));
        save();
        saveL();
        theme();
        sync();
        refresh();
        toast("Reset done.");
      };
      $("#sst").textContent = Store.ok
        ? "Storage: available in this browser."
        : "Storage: unavailable here. Settings last until you close this page.";

      /* ---------- Init ---------- */
      theme();
      go(
        TABS.some((t) => t[0] === S.start) || S.start === "set"
          ? S.start
          : "home",
      );
      addEventListener("pagehide", () => {
        D.a && D.stop(true);
      });
    </script>
  </body>
</html>
