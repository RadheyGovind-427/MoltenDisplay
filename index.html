<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>MoltenDisplay</title>
    <style>
      :root {
        --bg: #0e0f12;
        --fg: #f2f3f5;
        --card: #1b1d23;
        --bd: #3a3f4b;
        --ac: #ff8a1f;
        --acfg: #111;
        --dn: #c62020;
        --r: 14px;
        --g: 12px;
        font-family:
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
      }
      [data-theme="light"] {
        --bg: #f3f4f6;
        --fg: #14161a;
        --card: #fff;
        --bd: #b9bec9;
        --ac: #b94700;
        --acfg: #fff;
      }
      [data-theme="hc"] {
        --bg: #000;
        --fg: #fff;
        --card: #000;
        --bd: #fff;
        --ac: #ffe600;
        --acfg: #000;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-size: 16px;
      }
      [hidden] {
        display: none !important;
      }
      .scr {
        max-width: 720px;
        margin: 0 auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: var(--g);
      }
      h1 {
        margin: 8px 0 0;
        font-size: 2rem;
        letter-spacing: 0.5px;
      }
      h2 {
        margin: 0;
        font-size: 1.3rem;
      }
      h3 {
        margin: 6px 0 0;
        font-size: 1rem;
      }
      .sub {
        margin: 0;
        opacity: 0.8;
      }
      .small {
        font-size: 0.85rem;
        opacity: 0.8;
        margin: 0;
      }
      header {
        display: flex;
        align-items: center;
        gap: var(--g);
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      .btn,
      .chip,
      .tile {
        min-height: 48px;
        padding: 10px 14px;
        border-radius: var(--r);
        border: 2px solid var(--bd);
        background: var(--card);
        cursor: pointer;
        font-weight: 600;
      }
      .btn.pri {
        background: var(--ac);
        color: var(--acfg);
        border-color: var(--ac);
        min-height: 56px;
        font-size: 1.1rem;
      }
      .btn.dn,
      .tile.em {
        background: var(--dn);
        color: #fff;
        border-color: var(--dn);
      }
      .chip {
        min-height: 44px;
        padding: 6px 12px;
        font-weight: 500;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--ac);
        outline-offset: 2px;
      }
      .tile {
        min-height: 92px;
        font-size: 1.15rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .tile.em {
        min-height: 110px;
        font-size: 1.5rem;
        width: 100%;
      }
      .tile b {
        font-size: 1.8rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--g);
      }
      .grid .wide {
        grid-column: 1/-1;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.9rem;
      }
      label.ck {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        min-height: 44px;
      }
      input[type="checkbox"] {
        width: 24px;
        height: 24px;
      }
      input[type="range"] {
        width: 100%;
        height: 32px;
      }
      input[type="color"] {
        width: 100%;
        height: 44px;
        border: 2px solid var(--bd);
        border-radius: 10px;
        background: none;
        padding: 2px;
      }
      input[type="text"],
      textarea,
      select {
        padding: 10px;
        border-radius: 10px;
        border: 2px solid var(--bd);
        background: var(--card);
        width: 100%;
        min-height: 46px;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--g);
      }
      .box {
        border: 2px solid var(--bd);
        border-radius: var(--r);
        padding: 12px;
        background: var(--card);
        font-size: 0.9rem;
      }
      .prev {
        aspect-ratio: 16/9;
        width: 100%;
        border: 2px solid var(--bd);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #000;
      }
      .guides::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(#fff9, #fff9) center/1px 100% no-repeat,
          linear-gradient(#fff9, #fff9) center/100% 1px no-repeat;
      }
      .tw {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .st {
        width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.1;
        padding: 2%;
        font-weight: 800;
        font-family:
          system-ui, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji",
          sans-serif;
      }
      .sc {
        flex: none;
        white-space: nowrap;
        font-weight: 800;
        line-height: 1.1;
        font-family:
          system-ui, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji",
          sans-serif;
      }
      @keyframes scr {
        from {
          transform: translateX(var(--w));
        }
        to {
          transform: translateX(calc(var(--tw) * -1));
        }
      }
      .emo {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
        gap: 6px;
      }
      .emo button {
        font-size: 1.7rem;
        min-height: 52px;
        border-radius: 10px;
        border: 2px solid var(--bd);
        background: var(--card);
      }
      #emoin {
        font-size: 1.5rem;
      }
      .sos {
        font-size: 1.4rem;
        letter-spacing: 4px;
        text-align: center;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      li.m {
        border: 2px solid var(--bd);
        border-radius: var(--r);
        padding: 10px;
        background: var(--card);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .mt {
        font-weight: 700;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }
      #stage {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #000;
        touch-action: manipulation;
      }
      #content {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #dim {
        position: absolute;
        inset: 0;
        background: #000;
        pointer-events: none;
      }
      .ctl {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 8px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        z-index: 2;
      }
      .ctl button {
        min-height: 56px;
        min-width: 56px;
        padding: 8px 14px;
        border-radius: 12px;
        border: 3px solid #fff;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
      }
      #cd {
        align-self: center;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        border-radius: 10px;
        padding: 6px 10px;
        font-weight: 700;
      }
      #hint {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 0.9rem;
        text-align: center;
      }
      .hold {
        outline: 5px solid #ffe600;
      }
      #modal {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      #modal .box {
        max-width: 560px;
        max-height: 92vh;
        overflow: auto;
        font-size: 0.95rem;
      }
      #modal li {
        list-style: disc;
        margin-left: 18px;
        display: list-item;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 90;
        background: #222;
        color: #fff;
        border: 2px solid #fff;
        border-radius: 12px;
        padding: 10px 14px;
        max-width: 92vw;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      @media (orientation: landscape) and (max-height: 480px) {
        .tile {
          min-height: 70px;
        }
        .tile.em {
          min-height: 70px;
        }
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <div id="stage" hidden>
      <div id="content"></div>
      <div id="dim"></div>
      <div class="ctl">
        <button id="stopBtn" aria-label="Stop display">■ Stop</button
        ><span id="cd" aria-live="off"></span
        ><button id="lockBtn" aria-label="Lock touch">🔒 Lock</button>
      </div>
      <div id="hint" hidden>
        Touch lock on. Hold 🔓 for 1.5 s to unlock. Hold ■ for 1 s to stop.
        Android Back also stops.
      </div>
    </div>
    <div
      id="modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="mt"
    ></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <noscript>MoltenDisplay needs JavaScript enabled.</noscript>

            "aria-label": n,
            onclick: () => {
              S.tfg = f;
              S.tbg = b;
              save();
              sync();
              refresh();
            },
          },
          n,
        );
        c.style.cssText = `color:${f};background:${b}`;
        $("#combos").append(c);
      });
      $("#tgo").onclick = () => showText(S.text);

      /* ---------- Emoji board ---------- */
      let ecat = Object.keys(ECAT)[0];
      function drawEmo() {
        const g = $("#egrid");
        g.replaceChildren();
        ECAT[ecat].split(" ").forEach((e) =>
          g.append(
            h(
              "button",
              {
                "aria-label": "Add " + e,
                onclick: () => {
                  S.emo = (S.emo + e).slice(0, 120);
                  save();
                  sync();
                  refresh();
                },
              },
              e,
            ),
          ),
        );
        $$("#ecats button").forEach((b) =>
          b.setAttribute("aria-pressed", b.textContent === ecat),
        );
      }
      Object.keys(ECAT).forEach((c) =>
        $("#ecats").append(
          h(
            "button",
            {
              class: "chip",
              onclick: () => {
                ecat = c;
                drawEmo();
              },
            },
            c,
          ),
        ),
      );
      ESEQ.forEach((s) =>
        $("#eseq").append(
          h(
            "button",
            {
              class: "chip",
              onclick: () => {
                S.emo = s;
                save();
                sync();
                refresh();
              },
            },
            s,
          ),
        ),
      );
      $("#ebk").onclick = () => {
        const a = seg(S.emo);
        a.pop();
        S.emo = a.join("");
        save();
        sync();
        refresh();
      };
      $("#eclr").onclick = () => {
        S.emo = "";
        save();
        sync();
        refresh();
      };
      $("#ego").onclick = () =>
        D.start({
          name: "Emoji Board",
          dur: S.dur,
          render: (b) => renderText(b, eOpts()),
        });
      drawEmo();

      /* ---------- Emergency ---------- */
      $("#emain").onclick = () => showEm(S.emsg);
      EM.forEach((m) =>
        $("#emgrid").append(
          h(
            "button",
            {
              class: "btn" + (m === "HELP!" ? " dn" : ""),
              onclick: () => showEm(m),
            },
            m,
          ),
        ),
      );
      const sosSpec = (flash) => ({
        name: "SOS",
        dur: S.edur,
        render: (b) => {
          renderText(b, {
            text: "SOS",
            fg: "#ffffff",
            bg: "#000000",
            size: 90,
            align: "center",
            fit: true,
            steady: true,
          });
          flash && SOS.paint();
        },
        run: flash ? () => SOS.run() : null,
        halt: () => SOS.halt(),
      });
      $("#sosf").onclick = () => {
        if (S.steady) {
          toast(
            "Steady-only is on, so SOS stays steady. Change this in Settings.",
          );
          D.start(sosSpec(false));
          return;
        }
        gate(() => D.start(sosSpec(true)));
      };
      $("#soss").onclick = () => D.start(sosSpec(false));

      /* ---------- Quick messages ---------- */
      let ei = -1;
      const bt = (t, f, l) =>
        h("button", { class: "chip", "aria-label": l || t, onclick: f }, t);
      function renderLib() {
        const f = $("#lf").value,
          ul = $("#ll");
        ul.replaceChildren();
        const rows = L.map((m, i) => ({ m, i }))
          .filter((x) => f === "all" || (f === "fav" ? x.m.f : x.m.c === f))
          .sort((a, b) => (b.m.f ? 1 : 0) - (a.m.f ? 1 : 0));
        if (!rows.length)
          ul.append(
            h(
              "li",
              { class: "small" },
              "No messages here yet. Write one above and save it.",
            ),
          );
        rows.forEach(({ m, i }) =>
          ul.append(
            h(
              "li",
              { class: "m" },
              h("div", { class: "mt" }, m.t),
              h("small", {}, m.c),
              h(
                "div",
                { class: "row" },
                bt("Show", () => showText(m.t), "Show " + m.t),
                bt("To Text Board", () => {
                  S.text = m.t;
                  save();
                  go("text");
                }),
                bt(
                  m.f ? "★" : "☆",
                  () => {
                    m.f = m.f ? 0 : 1;
                    saveL();
                    renderLib();
                  },
                  m.f ? "Remove favorite" : "Mark favorite",
                ),
                bt("Edit", () => {
                  ei = i;
                  $("#lt").value = m.t;
                  $("#lc").value = m.c;
                  $("#lsave").textContent = "Update message";
                  $("#lcan").hidden = false;
                  $("#lt").focus();
                }),
                bt(
                  "Delete",
                  () => {
                    L.splice(i, 1);
                    saveL();
                    if (ei === i) endEdit();
                    renderLib();
                  },
                  "Delete " + m.t,
                ),
              ),
            ),
          ),
        );
      }
      function endEdit() {
        ei = -1;
        $("#lt").value = "";
        $("#lsave").textContent = "Save message";
        $("#lcan").hidden = true;
      }
      $("#lf").onchange = renderLib;
      $("#lcan").onclick = endEdit;
      $("#lemo").onclick = () => {
        $("#lt").value = ($("#lt").value + " " + S.emo).trim().slice(0, 500);
      };
      $("#lsave").onclick = () => {
        const t = $("#lt").value.trim();
        if (!t) {
          toast("Type a message first.");
          return;
        }
        if (ei >= 0) {
          L[ei].t = t;
          L[ei].c = $("#lc").value;
        } else L.unshift({ t, c: $("#lc").value, f: 0 });
        saveL();
        endEdit();
        renderLib();
        toast(
          Store.ok
            ? "Message saved."
            : "Saved for this session only (browser storage unavailable).",
        );
      };

      /* ---------- Settings ---------- */
      $("#srst").onclick = () => {
        if (!confirm("Reset all settings and saved messages?")) return;
        S = Object.assign({}, DEF);
        L = DLIB.map((m) => ({ ...m }));
        save();
        saveL();
        theme();
        sync();
        refresh();
        toast("Reset done.");
      };
      $("#sst").textContent = Store.ok
        ? "Storage: available in this browser."
        : "Storage: unavailable here. Settings last until you close this page.";

      /* ---------- Init ---------- */
      theme();
      go(
        ["home", "vis", "text", "emoji", "emerg", "lib"].includes(S.start)
          ? S.start
          : "home",
      );
      addEventListener("pagehide", () => {
        D.a && D.stop(true);
      });
    </script>
  </body>
</html>
